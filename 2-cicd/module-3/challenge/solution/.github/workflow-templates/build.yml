name: Build

on:
  workflow_call:
    inputs:
      node_version:
        description: Insert a node version pls
        required: true
        type: string
        default: '14'
        
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2

      - name: Setup Node
        uses: actions/setup-node@v2
        with:
          node-version: ${{inputs.node_version}}

      - name: Install Dependencies
        run: npm install